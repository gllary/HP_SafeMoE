name: hpsafe-mattervial-orb
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pyyaml=6.*
  - ijson=3.*
  - orjson=3.*
  - requests=2.32.*
  - xgboost=2.1.*
  - tqdm=4.*
  - pip:
      # This is MatterVial's official ORB runtime family and uses the host NVIDIA driver.
      - orb-models==0.5.4
      - torch==2.7.1
      - tensorflow==2.20.0
      - megnet==1.3.2
      - contextlib2==21.6.0
      - pickle-mixin==1.0.2
      - pymatgen==2025.6.14
      - matminer==0.9.3
      - ase==3.25.0
      - spglib==2.6.0
      - h5py
      - pandas
      - scikit-learn
      - scipy
