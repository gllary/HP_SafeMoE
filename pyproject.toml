[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hp-safe-moe"
version = "1.0.1"
description = "HP-SafeMoE source, evaluation outputs, and reproducibility assets"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "ijson>=3.3,<4",
  "numpy>=1.23.5,<3",
  "orjson>=3.9,<4",
  "pandas>=2.1,<3",
  "pymatgen>=2023.9.25",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "xgboost>=2.1,<3",
]

[project.optional-dependencies]
dev = ["matplotlib>=3.8", "pytest>=8.0", "ruff>=0.6"]
moe = ["torch>=2.5,<3"]
native = ["torch>=2.5,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
