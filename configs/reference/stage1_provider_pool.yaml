schema_version: stage1-provider-pool
configuration_status: release
protocol: one_strongest_frozen_expert_per_task
split_protocol: stage1_train_val_test
stage2_input_protocol: frozen_provider_exports
relation_learning_scope: stage2_outer_train
availability_mask_policy: source_runtime_availability

